name: CI-Test-Deploy

on:
  push:
    branches:
      - sftp-key-deploy # Only trigger on your test branch
  workflow_dispatch:   # Allows you to click "Run Workflow" manually

jobs:
  # We keep the name so it's familiar, but remove 'needs' 
  # so it starts immediately.
  build-publish:
    runs-on: ubuntu-latest
    # REMOVED: 'if' conditions that restrict it to master
    # REMOVED: 'needs' [test-front-end, etc.]
    steps:
      - name: "checking out"
        uses: actions/checkout@v3

      - name: "setting up Java"
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11.x'

      - name: Configure Maven and SSH
        run: |
          # 1. Setup the Private Key
          mkdir -p ~/.ssh
          echo "${{ secrets.GS_MAVEN_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H maven.geosolutionsgroup.com >> ~/.ssh/known_hosts

          # 2. Generate a custom settings.xml
          # We place the SSH config inside the <server> block 
          # so the default Maven Wagon (JSch) sees it.
          cat <<EOF > ${{ github.workspace }}/deploy-settings.xml
          <settings>
            <servers>
              <server>
                <id>geosolutions</id>
                <username>${{ secrets.GS_MAVEN_USERNAME }}</username>
                <privateKey>/home/runner/.ssh/id_rsa</privateKey>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish maven packages
        run: |
          # Use -s to point to our custom settings file
          mvn clean install deploy -f java/pom.xml \
            -DskipTests -X \
            -s ${{ github.workspace }}/deploy-settings.xml
          
          mvn deploy --non-recursive -DskipTests -X \
            -s ${{ github.workspace }}/deploy-settings.xml