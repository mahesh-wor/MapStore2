name: CI-Test-Deploy

on:
  push:
    branches:
      - sftp-key-deploy # Only trigger on your test branch
  workflow_dispatch:   # Allows you to click "Run Workflow" manually

jobs:
  # We keep the name so it's familiar, but remove 'needs' 
  # so it starts immediately.
  build-publish:
    runs-on: ubuntu-latest
    # REMOVED: 'if' conditions that restrict it to master
    # REMOVED: 'needs' [test-front-end, etc.]
    steps:
      - name: "checking out"
        uses: actions/checkout@v3

      - name: "setting up Java"
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11.x'
          server-id: geosolutions
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Publish maven packages (TEST)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Testing the NEW host
          ssh-keyscan -H maven.geosolutionsgroup.com >> ~/.ssh/known_hosts
          
          # Use -DskipTests to make it lightning fast
          # and -X if you need to see full debug logs for the SFTP transfer
          mvn clean install deploy -f java/pom.xml -DskipTests -X
          
          mvn deploy --non-recursive -DskipTests -X
        env:
          MAVEN_USERNAME: ${{ secrets.GS_MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.GS_MAVEN_PASSWORD }}