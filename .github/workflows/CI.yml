name: CI-Test-Deploy

on:
  push:
    branches:
      - sftp-key-deploy # Only trigger on your test branch
  workflow_dispatch:   # Allows you to click "Run Workflow" manually

jobs:
  # We keep the name so it's familiar, but remove 'needs' 
  # so it starts immediately.
  build-publish:
    runs-on: ubuntu-latest
    # REMOVED: 'if' conditions that restrict it to master
    # REMOVED: 'needs' [test-front-end, etc.]
    steps:
      - name: "checking out"
        uses: actions/checkout@v3

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GS_MAVEN_SSH_KEY }}

      - name: Trust Geosolutions Host
        run: ssh-keyscan -H maven.geosolutionsgroup.com >> ~/.ssh/known_hosts

      - name: Set up JDK and Maven Settings
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Update to your specific Java version
          distribution: 'temurin'
          server-id: geosolutions
          server-username: GS_USERNAME # This tells Maven to look for an env var named $GS_USERNAME

      - name: Publish maven packages
        env:
          # actions/setup-java will read this environment variable and use it for the 'geosolutions' server ID
          GS_USERNAME: ${{ secrets.GS_MAVEN_USERNAME }}
        run: |
          # No need to specify -s, setup-java puts the generated settings.xml in the default ~/.m2/ location
          mvn clean install deploy -f java/pom.xml -DskipTests -X
          mvn deploy --non-recursive -DskipTests -X